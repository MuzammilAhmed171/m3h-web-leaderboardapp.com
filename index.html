<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 LeaderboardApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables for Theming */
        :root {
            /* Light Theme */
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #000000;
            --text-secondary: #333333;
            --accent-color: #6c63ff;
            --button-bg: #6c63ff;
            --button-text: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #f5f5f5;
            --footer-bg: #f5f5f5;
            --flash-color: #a0e7e5;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            
            /* Transitions */
            --transition: all 0.3s ease;
        }

        .dark-theme {
            --bg-primary: #1e1e2f;
            --bg-secondary: #2c2c3e;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --card-bg: #2c2c3e;
            --header-bg: #1e1e2f;
            --footer-bg: #1e1e2f;
            --border-color: #3a3a4e;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            line-height: 1.6;
        }

        html {
            scroll-behavior: smooth;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        header {
            background-color: var(--header-bg);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px var(--shadow-color);
            transition: var(--transition);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            gap: 10px;
        }

        .logo i {
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        .theme-toggle {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Hero Section */
        #hero {
            background: linear-gradient(135deg, #6c63ff, #3f3d56);
            color: white;
            padding: 80px 0;
            text-align: center;
            border-radius: 0 0 30px 30px;
            margin-bottom: 50px;
        }

        .hero-content {
            max-width: 700px;
            margin: 0 auto;
        }

        .hero-content h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(108, 99, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(108, 99, 255, 0.4);
        }

        /* Leaderboard Section */
        #leaderboard {
            padding: 20px 0 60px;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sort-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select, .sort-btn {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        select {
            min-width: 180px;
        }

        .sort-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .sort-btn:hover {
            opacity: 0.9;
        }

        .simulate-btn {
            background-color: #ff6584;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .simulate-btn:hover {
            opacity: 0.9;
        }

        /* Leaderboard Cards */
        .leaderboard-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .user-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px var(--shadow-color);
        }

        .rank {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--accent-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.8rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin: 15px 0;
        }

        .name {
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .score {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .medal-gold {
            color: gold;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        .medal-silver {
            color: silver;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        .medal-bronze {
            color: #cd7f32; /* bronze color */
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        /* Animation for Rank Change */
        @keyframes flash {
            0% { background-color: inherit; }
            50% { background-color: var(--flash-color); }
            100% { background-color: inherit; }
        }

        .rank-change {
            animation: flash 1.5s ease;
        }

        /* Footer */
        footer {
            background-color: var(--footer-bg);
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            background-color: #5a52e0;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .leaderboard-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .sort-controls {
                flex-wrap: wrap;
            }
            
            .hero-content h1 {
                font-size: 2.3rem;
            }
        }

        @media (max-width: 600px) {
            .leaderboard-container {
                grid-template-columns: 1fr;
            }
            
            .hero-content h1 {
                font-size: 2rem;
            }
            
            .hero-content p {
                font-size: 1rem;
            }
            
            .btn, .sort-btn, .simulate-btn, select {
                width: 100%;
            }
            
            .sort-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="light-theme">
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-trophy"></i>
                    <span>LeaderboardApp</span>
                </div>
                <button class="theme-toggle" id="theme-toggle">
                    <i class="fas fa-moon"></i> Dark Mode
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="hero">
        <div class="container">
            <div class="hero-content">
                <h1>Welcome to LeaderboardApp</h1>
                <p>Track top users, scores, and rankings in real-time!</p>
                <a href="#leaderboard" class="btn">See Leaderboard</a>
            </div>
        </div>
    </section>

    <!-- Leaderboard Section -->
    <section id="leaderboard">
        <div class="container">
            <h2 class="section-title"><i class="fas fa-trophy"></i> Leaderboard</h2>
            
            <div class="controls">
                <div class="sort-controls">
                    <select id="sort-by">
                        <option value="score">Sort by Score</option>
                        <option value="name">Sort by Name</option>
                    </select>
                    <button class="sort-btn" id="sort-button">Sort</button>
                </div>
                <button class="simulate-btn" id="simulate">Simulate Score Change</button>
            </div>
            
            <div class="leaderboard-container" id="leaderboard-container">
                <!-- User cards will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>© 2025 LeaderboardApp. Built with ❤️ using HTML, CSS, JavaScript</p>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // User data
        const users = [
            { id: 1, name: "Alex Johnson", score: 985, rank: 1 },
            { id: 2, name: "Taylor Smith", score: 932, rank: 2 },
            { id: 3, name: "Jordan Williams", score: 910, rank: 3 },
            { id: 4, name: "Morgan Davis", score: 875, rank: 4 },
            { id: 5, name: "Casey Brown", score: 842, rank: 5 },
            { id: 6, name: "Riley Garcia", score: 821, rank: 6 },
            { id: 7, name: "Quinn Martinez", score: 795, rank: 7 },
            { id: 8, name: "Avery Rodriguez", score: 762, rank: 8 },
            { id: 9, name: "Peyton Wilson", score: 740, rank: 9 },
            { id: 10, name: "Dakota Anderson", score: 710, rank: 10 },
            { id: 11, name: "Skyler Thomas", score: 685, rank: 11 },
            { id: 12, name: "Cameron Jackson", score: 650, rank: 12 }
        ];

        // DOM Elements
        const leaderboardContainer = document.getElementById('leaderboard-container');
        const themeToggle = document.getElementById('theme-toggle');
        const sortButton = document.getElementById('sort-button');
        const sortBySelect = document.getElementById('sort-by');
        const simulateButton = document.getElementById('simulate');
        const body = document.body;

        // Initialize leaderboard
        function renderLeaderboard() {
            leaderboardContainer.innerHTML = '';
            
            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.dataset.id = user.id;
                
                // Determine badge
                let badge = '';
                let badgeClass = '';
                if (user.rank === 1) {
                    badge = '🥇';
                    badgeClass = 'medal-gold';
                } else if (user.rank === 2) {
                    badge = '🥈';
                    badgeClass = 'medal-silver';
                } else if (user.rank === 3) {
                    badge = '🥉';
                    badgeClass = 'medal-bronze';
                }
                
                card.innerHTML = `
                    <div class="rank">${user.rank}</div>
                    <div class="badge ${badgeClass}">${badge}</div>
                    <img src="https://i.pravatar.cc/150?img=${user.id}" alt="${user.name}" class="avatar">
                    <div class="name">${user.name}</div>
                    <div class="score">${user.score}</div>
                `;
                
                leaderboardContainer.appendChild(card);
            });
        }

        // Theme toggle functionality
        function toggleTheme() {
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i> Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        }

        // Sort functionality
        function sortLeaderboard() {
            const sortBy = sortBySelect.value;
            
            if (sortBy === 'score') {
                users.sort((a, b) => b.score - a.score);
            } else if (sortBy === 'name') {
                users.sort((a, b) => a.name.localeCompare(b.name));
            }
            
            // Update ranks based on score
            users.sort((a, b) => b.score - a.score).forEach((user, index) => {
                user.rank = index + 1;
            });
            
            renderLeaderboard();
        }

        // Simulate score changes
        function simulateScoreChanges() {
            // Create a copy of users for comparison
            const oldUsers = [...users];
            
            // Update scores randomly
            users.forEach(user => {
                const change = Math.floor(Math.random() * 100) - 40; // -40 to +60
                user.score = Math.max(100, user.score + change);
            });
            
            // Re-sort by score to update ranks
            sortLeaderboard();
            
            // Highlight cards with rank changes
            users.forEach(user => {
                const oldUser = oldUsers.find(u => u.id === user.id);
                if (oldUser && oldUser.rank !== user.rank) {
                    const card = document.querySelector(`.user-card[data-id="${user.id}"]`);
                    if (card) {
                        card.classList.add('rank-change');
                        setTimeout(() => {
                            card.classList.remove('rank-change');
                        }, 1500);
                    }
                }
            });
        }

        // Event Listeners
        themeToggle.addEventListener('click', toggleTheme);
        sortButton.addEventListener('click', sortLeaderboard);
        simulateButton.addEventListener('click', simulateScoreChanges);

        // Initialize
        function init() {
            // Load saved theme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                toggleTheme();
            }
            
            // Render initial leaderboard
            renderLeaderboard();
        }

        init();
    </script>
</body>
</html>
